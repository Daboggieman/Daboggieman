name: cards

# Renders the SVG cards from live GitHub data and commits them back, so the
# profile serves its own images instead of depending on a third-party widget
# host staying up or staying paid.
on:
  schedule:
    # 06:17 UTC — off the hour, because every scheduled job on the hour queues
    # behind every other one on GitHub's shared runners.
    - cron: "17 6 * * *"
  push:
    branches: [master]
    paths:
      - "cmd/cards/**"
      - "go.mod"
      - ".github/workflows/cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Test
        run: go test ./...

      - name: Render cards
        env:
          # Visibility is entirely a property of this token.
          #
          #   GITHUB_TOKEN (built-in)  public repos only; private ones are absent
          #                            from the skyline and the language shares.
          #   CARDS_TOKEN  (a PAT)     add a classic PAT with the `repo` and
          #                            `read:user` scopes as a repository secret
          #                            named CARDS_TOKEN and private repositories
          #                            appear too, counted for their activity.
          #
          # The cards say which of the two they were rendered with, so the footer
          # never overstates what it measured.
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
          # Repos that should not be named on a public page at all, private or
          # not. Excluded before anything is counted, so they leave no trace.
          EXCLUDE: ${{ vars.CARDS_EXCLUDE }}
        run: go run ./cmd/cards -login "${{ github.repository_owner }}" -exclude "$EXCLUDE"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          # The generator is deterministic apart from the render date, so most
          # runs produce no diff at all. Nothing to commit is the success case.
          if git diff --cached --quiet; then
            echo "cards unchanged"
            exit 0
          fi
          git commit -m "cards: refresh from live profile data"
          git push
